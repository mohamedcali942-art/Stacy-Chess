<script>
/* v11 start-up guard: if a script error stops start-up, or the app has not drawn a screen after 12 s,
   show a plain recovery card instead of a blank page. "Start without analysis" pauses the background
   game analysis for this start (saved progress is kept). */
(function () {
  var errs = [];
  window.__stacyBootErrors = errs;
  window.addEventListener('error', function (e) { if (!window.__stacyBooted) errs.push(String(e && (e.message || e.type) || 'error')); if (!window.__stacyBooted) setTimeout(show, 0); });
  function show() {
    if (window.__stacyBooted) return; var v = document.getElementById('view'); if (!v) return;
    v.innerHTML = '<div class="card" style="margin:40px 16px;padding:20px;background:#fff;color:#111;border-radius:16px"><h3>Stacy could not start</h3><p>' + (errs.length ? 'Error: ' + String(errs[0]).replace(/[<>&]/g, '') : 'Start-up is taking too long.') + '</p><p style="font-size:13px;color:#555">Your saved progress is still on this device.</p><p><button type="button" onclick="location.reload()" style="padding:10px 14px;border-radius:10px">Reload</button> <button type="button" onclick="try{localStorage.setItem(\'stacy-safe-start\',\'1\')}catch(e){};location.reload()" style="padding:10px 14px;border-radius:10px">Start without analysis</button></p></div>';
  }
  setTimeout(show, 12000);
  // Back from the iOS/Safari page cache, or a tab that was discarded and restored: never leave it blank.
  window.addEventListener('pageshow', function () { var v = document.getElementById('view'); if (window.__stacyBooted && window.App && v && !v.querySelector('.screen')) try { App.route(); } catch (e) { } });
})();
</script>

  </header>
  <main id="view"><div class="card center" style="margin-top:40px"><p>Loading Stacy…</p></div></main>
</div>

<script>
/* Load chess.js 0.10.3 (rules). v9: bundled in vendor/ (BSD-2), no remote copies, so the app works offline. */
(function () {
  var urls = ['vendor/chess.js'];
  function load(i) {
    if (i >= urls.length) return App.boot();
    var s = document.createElement('script'); s.src = urls[i];
    s.onload = function () { App.boot(); }; s.onerror = function () { load(i + 1); };
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
